<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <h:outputStylesheet name="system/style.css" library="css"/>
    <h:outputStylesheet name="reliabilityLimit.css" library="css"/>
    <h:outputScript name="system/mainScript.js" library="js"/>
</h:head>
<h:body>
    <h:form>
        <p:remoteCommand autoRun="true" onstart="iframeStatus([{name:'inIframe', value:inIframe()}]);" />
        <p:remoteCommand name="iframeStatus" action="#{reliabilityLimit.changeInIframe()}"/>

        <p:remoteCommand name="load"
                         onstart="PF('statusDialog').show();"
                         action="#{reliabilityLimit.loadData()}"
                         oncomplete="PF('statusDialog').hide();"
                         update="reliabilityLimitPanel:limit"/>
    </h:form>

    <p:growl id="growl" showDetail="true"/>

    <h:form id="reliabilityLimitPanel" style="height: 100%;">
        <div style="height: 100%;">
            <p:panel id="limitPanel" styleClass="tc-panel" header="#{reliabilityLimit.objectPath}" style="padding-bottom: 5px;">
                <div style="height: 100%; padding: 3px 0 3px 3px;">
                    <p:dataTable id="limit" value="#{reliabilityLimit.data}" var="limit" scrollable="true" scrollHeight="100%"
                                 editable="true" editMode="cell" rowKey="#{limit.id}" emptyMessage="#{global['table.empty.value']}"
                                 widgetVar="limitWidget" rowIndexVar="rowIndex">

                        <p:ajax event="cellEdit" listener="#{reliabilityLimit.onCellEdit}" update=":growl" />

                        <p:columnGroup type="header">
                            <p:row>
                                <p:column rowspan="2" headerText="Обозн" width="360"/>
                                <p:column rowspan="2" headerText="Тех.пр." width="90"/>
                                <p:column rowspan="2" headerText="Зона" width="90"/>
                                <p:column rowspan="2" headerText="Ед.изм" width="90"/>
                                <p:column colspan="2" headerText="Границы достоверности"/>
                            </p:row>
                            <p:row>
                                <p:column headerText="Нижняя" width="90"/>
                                <p:column headerText="Верхняя" width="90"/>
                            </p:row>
                        </p:columnGroup>

                        <p:column>
                            <h:outputText value="#{limit.parName}"/>
                        </p:column>
                        <p:column styleClass="center">
                            <h:outputText value="#{limit.techProcCode}"/>
                        </p:column>
                        <p:column styleClass="center">
                            <h:outputText value="#{limit.zone}"/>
                        </p:column>
                        <p:column styleClass="center">
                            <h:outputText value="#{limit.measureName}"/>
                        </p:column>
                        <p:column styleClass="center">
                            <p:cellEditor disabled="#{!systemParamsUtil.write}">
                                <f:facet name="output">
                                    <h:outputText value="#{limit.min}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{limit.min}"
                                                   minValue="-100" maxValue="100"
                                                   decimalPlaces="2" decimalSeparator="." decimalSeparatorAlternative=","/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column styleClass="center">
                            <p:cellEditor disabled="#{!systemParamsUtil.write}">
                                <f:facet name="output">
                                    <h:outputText value="#{limit.max}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{limit.max}"
                                                   minValue="-100" maxValue="100"
                                                   decimalPlaces="2" decimalSeparator="." decimalSeparatorAlternative=","/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                    </p:dataTable>
                </div>

                <f:facet name="actions">
                    <p:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default tc-success tc-no-loading tc-small"
                                   onclick="PF('statusDialog').show();" rendered="#{systemParamsUtil.write}"
                                   action="#{reliabilityLimit.onSaveChanges()}"
                                   update="reliabilityLimitPanel:limit growl"
                                   oncomplete="PF('statusDialog').hide();">
                        <h:outputText styleClass="ui-icon pi pi-save"/>
                    </p:commandLink>
                </f:facet>
            </p:panel>
        </div>
    </h:form>

    <p:dialog id="statusDialog" modal="true" widgetVar="statusDialog" draggable="false" closable="false"
              resizable="false" style="box-shadow: none;">
        <i class="pi pi-spinner pi-spin" style="font-size: 5rem;" />
    </p:dialog>
</h:body>
</html>
